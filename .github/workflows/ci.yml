name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-PSResource -Name Pester -Version '[5.5.0,6.0.0)' -Repository PSGallery -TrustRepository -Scope CurrentUser -Quiet
          Install-PSResource -Name PSScriptAnalyzer -Version '[1.22.0,2.0.0)' -Repository PSGallery -TrustRepository -Scope CurrentUser -Quiet

      - name: Lint (PSScriptAnalyzer)
        shell: pwsh
        run: |
          # The analyzer intermittently crashes with a NullReferenceException; crashes are retried, findings still fail.
          $files = @(Get-ChildItem -Path ./Ctx -Recurse -Include *.ps1, *.psm1, *.psd1) + @(Get-Item ./Install.ps1, ./Uninstall.ps1)
          $findings = foreach ($f in $files) {
              for ($attempt = 1; ; $attempt++) {
                  try { Invoke-ScriptAnalyzer -Path $f.FullName -Settings ./PSScriptAnalyzerSettings.psd1 -ErrorAction Stop; break }
                  catch {
                      if ($attempt -ge 3) { throw }
                      Write-Warning "PSScriptAnalyzer crashed on $($f.Name) (attempt $attempt): $($_.Exception.Message) - retrying"
                  }
              }
          }
          $findings | Format-Table -AutoSize ScriptName, Line, RuleName, Message | Out-String -Width 300
          if ($findings) { throw "$(@($findings).Count) PSScriptAnalyzer finding(s)" }

      - name: Test (Pester)
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = 'testResults.xml'
          Invoke-Pester -Configuration $cfg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: testResults.xml
          if-no-files-found: ignore
